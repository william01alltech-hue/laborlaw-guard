<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B13" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景圓角 -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" />

  <!-- 守護神天平與盾牌圖形 -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- 盾牌外框 -->
    <path d="M256 32L64 112v160c0 144 192 240 192 240s192-96 192-240V112L256 32z" 
          fill="none" stroke="url(#logo-grad)" stroke-width="28" stroke-linejoin="round" />
    
    <!-- 內部天平 -->
    <!-- 支柱 -->
    <line x1="256" y1="130" x2="256" y2="380" stroke="#fff" stroke-width="20" stroke-linecap="round" />
    <!-- 橫桿 -->
    <line x1="140" y1="180" x2="372" y2="180" stroke="#fff" stroke-width="20" stroke-linecap="round" />
    <!-- 頂部圓球 -->
    <circle cx="256" cy="130" r="22" fill="url(#logo-grad)" />
    <!-- 左秤盤 -->
    <line x1="140" y1="180" x2="100" y2="280" stroke="rgba(255,255,255,0.7)" stroke-width="12" />
    <line x1="140" y1="180" x2="180" y2="280" stroke="rgba(255,255,255,0.7)" stroke-width="12" />
    <path d="M90 280h100c0 30-22 50-50 50s-50-20-50-50z" fill="url(#logo-grad)" />
    <!-- 右秤盤 -->
    <line x1="372" y1="180" x2="332" y2="280" stroke="rgba(255,255,255,0.7)" stroke-width="12" />
    <line x1="372" y1="180" x2="412" y2="280" stroke="rgba(255,255,255,0.7)" stroke-width="12" />
    <path d="M322 280h100c0 30-22 50-50 50s-50-20-50-50z" fill="url(#logo-grad)" />
    <!-- 底座 -->
    <path d="M186 380h140c10 0 20 15 20 30H166c0-15 10-30 20-30z" fill="#fff" />
  </g>
</svg>
